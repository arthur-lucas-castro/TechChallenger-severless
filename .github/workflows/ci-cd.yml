name: CI/CD Pipeline

# Fluxo de release: o PR de release/X.Y.Z para a main roda lint, testes e pacote; o merge
# (push na main) publica a Lambda. O disparo manual numa release/X.Y.Z serve para redeploy.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Confirma o deploy manual desta release (redeploy)?'
        required: true
        type: choice
        options:
          - 'no'
          - 'yes'
        default: 'no'

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      # Falha se a cobertura ficar abaixo de 80% (jest.config.js).
      - name: Testes com cobertura
        run: npm run test:coverage

      - name: Empacotar a Lambda
        run: npm run package

      - name: Upload do pacote e da cobertura como artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lambda-auth-${{ github.sha }}
          path: |
            dist/lambda-auth.zip
            coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 15

  # Decide se há deploy. Um push na main só publica quando o commit veio do merge de um PR
  # de release/X.Y.Z; outros merges na main rodam apenas lint, testes e pacote.
  resolve-release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.release.outputs.release }}
      deploy: ${{ steps.release.outputs.deploy }}
    steps:
      - name: Descobrir a release que originou o deploy
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          CONFIRM: ${{ github.event.inputs.confirm_deploy }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "push" ]; then
            branch=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq \
              '[.[] | select(.merged_at != null and .base.ref == "main" and (.head.ref | startswith("release/")))][0].head.ref // ""')
            if [ -z "$branch" ]; then
              echo "::notice::Commit na main sem PR de release/X.Y.Z: lint, testes e pacote rodam, deploy não."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            if [ "$CONFIRM" != "yes" ] || [[ "$REF_NAME" != release/* ]]; then
              echo "::notice::Deploy manual exige uma branch release/X.Y.Z e confirm_deploy=yes."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            branch="$REF_NAME"
          fi
          echo "Deploy da Lambda a partir de $branch."
          echo "release=$branch" >> "$GITHUB_OUTPUT"
          echo "deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [quality, resolve-release]
    if: needs.resolve-release.outputs.deploy == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      confirm_deploy: 'yes'
    secrets: inherit
